<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Khởi Động - Splash Screen | Fractal Tree NFC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f1412;
      --accent-green: #4ade80;
      --accent-gold: #fbbf24;
      --text-main: #f0fdf4;
      --text-muted: #86a397;
      --border-subtle: rgba(74, 222, 128, 0.15);
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #080b0a;
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }

    .phone-frame {
      width: 100%;
      max-width: 412px;
      height: 860px;
      background: radial-gradient(circle at 50% 45%, #182620, #0a0e0c);
      border-radius: 46px;
      border: 8px solid #243029;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 48px;
      cursor: pointer;
    }

    .notch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 115px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
    }

    /* Central Content Wrapper */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Hero Leaf Wrapper (Không vòng tròn bao bọc, đổi dáng lá và màu sắc ngẫu nhiên) */
    .leaf-hero-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .nfc-pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1.5px solid rgba(74, 222, 128, 0.35);
      opacity: 0;
      animation: pulseRipple 2.6s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
      pointer-events: none;
    }
    .nfc-pulse-ring:nth-child(2) { animation-delay: 0.8s; }
    .nfc-pulse-ring:nth-child(3) { animation-delay: 1.6s; }

    @keyframes pulseRipple {
      0% { transform: scale(0.4); opacity: 0.85; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .hero-leaf-canvas {
      width: 120px;
      height: 120px;
      z-index: 2;
      filter: drop-shadow(0 0 25px rgba(74, 222, 128, 0.8)) drop-shadow(0 0 45px rgba(74, 222, 128, 0.45));
      transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s ease, filter 0.15s ease;
    }

    .app-title {
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-align: center;
    }

    .app-subtitle {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-green);
      letter-spacing: 2.2px;
      text-align: center;
      margin-bottom: 22px;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    /* Vạch loading nằm ngay phía bên dưới của chữ NFC Mobile Game */
    .loading-bar-wrap {
      width: 150px;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #4ade80, #fbbf24);
      border-radius: 4px;
      animation: loadFill 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes loadFill {
      0% { width: 0%; }
      55% { width: 72%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="phone-frame" onclick="enterGarden()" title="Chạm để vào vườn">
    <div class="notch"></div>

    <div class="center-content">
      <!-- Radiating Hero Leaf Canvas (Vẽ 14 dạng lá chuẩn 100% từ GitHub bằng HTML5 Canvas 2D) -->
      <div class="leaf-hero-wrapper">
        <div class="nfc-pulse-ring"></div>
        <div class="nfc-pulse-ring"></div>
        <div class="nfc-pulse-ring"></div>
        <canvas id="heroLeafCanvas" width="240" height="240" class="hero-leaf-canvas"></canvas>
      </div>

      <h1 class="app-title">Fractal Tree</h1>
      <div class="app-subtitle" id="appSubtitle">NFC MOBILE GAME</div>

      <!-- Vạch loading nằm ngay phía bên dưới của chữ NFC Mobile Game -->
      <div class="loading-bar-wrap">
        <div class="loading-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. TOÀN BỘ 12 BẢNG MÀU SẮC LÁ CHUẨN XÁC 100% TỪ GITHUB REPOSITORY
    //    (Nguồn: source-reference/lib/fractal-branch-tree.js lines 2480-2605)
    // =========================================================================
    const GITHUB_LEAF_PALETTES = [
      // 1. Sakura (Hoa Anh Đào)
      { name: 'Sakura Pink',        hex: '#fda4ba', rgb: '253, 164, 186' },
      { name: 'Soft Magenta',       hex: '#f472b6', rgb: '244, 114, 182' },
      { name: 'Pearl White-Pink',   hex: '#fce7f3', rgb: '252, 231, 243' },

      // 2. Autumn (Phong Đỏ)
      { name: 'Crimson Red',        hex: '#dc2626', rgb: '220, 38, 38' },
      { name: 'Fiery Scarlet',      hex: '#ef4444', rgb: '239, 68, 68' },
      { name: 'Fiery Orange-Red',   hex: '#f97316', rgb: '249, 115, 22' },
      { name: 'Deep Ruby Wine',     hex: '#b91c1c', rgb: '185, 28, 28' },

      // 3. Ginkgo (Ngân Hạnh)
      { name: 'Bright Canary',      hex: '#facc15', rgb: '250, 204, 21' },
      { name: 'Sun Gold',           hex: '#eab308', rgb: '234, 179, 8' },
      { name: 'Warm Honey',         hex: '#f59e0b', rgb: '245, 158, 11' },

      // 4. Wisteria (Tử Đằng)
      { name: 'Pastel Lavender',    hex: '#c084fc', rgb: '192, 132, 252' },
      { name: 'Royal Violet',       hex: '#a855f7', rgb: '168, 85, 247' },
      { name: 'Soft Orchid',        hex: '#e879f9', rgb: '232, 121, 249' },

      // 5. Frost (Băng Tuyết)
      { name: 'Ice Cyan',           hex: '#38bdf8', rgb: '56, 189, 248' },
      { name: 'Diamond Sky',        hex: '#7dd3fc', rgb: '125, 211, 252' },
      { name: 'Frozen Crystal',     hex: '#e0f2fe', rgb: '224, 242, 254' },

      // 6. Sunset (Hoàng Hôn)
      { name: 'Coral Red',          hex: '#f43f5e', rgb: '244, 63, 94' },
      { name: 'Fiery Peach',        hex: '#fb923c', rgb: '251, 146, 60' },
      { name: 'Golden Flame',       hex: '#fbbf24', rgb: '251, 191, 36' },

      // 7. Midnight (Dạ Lam)
      { name: 'Celestial Indigo',   hex: '#6366f1', rgb: '99, 102, 241' },
      { name: 'Sapphire Blue',      hex: '#3b82f6', rgb: '59, 130, 246' },
      { name: 'Neon Violet-Blue',   hex: '#818cf8', rgb: '129, 140, 248' },

      // 8. Eucalyptus (Bạch Đàn Khói Bạc)
      { name: 'Glaucous Sage',      hex: '#92b9a5', rgb: '146, 185, 165' },
      { name: 'Powdered Eucalyptus',hex: '#a8cab8', rgb: '168, 202, 184' },
      { name: 'Dusty Teal',         hex: '#7aa08e', rgb: '122, 160, 142' },

      // 9. Golden (Kim Sa)
      { name: 'Kim Sa Hoàng Kim',   hex: '#fef08a', rgb: '254, 240, 138' },
      { name: 'Vàng Hoàng Gia',     hex: '#facc15', rgb: '250, 204, 21' },
      { name: 'Hổ Phách Vàng Đồng', hex: '#ca8a04', rgb: '202, 138, 4' },

      // 10. Ruby (Hồng Ngọc)
      { name: 'Hồng Ngọc Sáng',     hex: '#fb7185', rgb: '251, 113, 133' },
      { name: 'Huyết Ngọc',         hex: '#f43f5e', rgb: '244, 63, 94' },
      { name: 'Hồng Ngọc Thẫm',     hex: '#be123c', rgb: '190, 18, 60' },

      // 11. Shadow (Hư Không / Hắc Thạch)
      { name: 'Xám Bạc Hư Không',   hex: '#94a3b8', rgb: '148, 163, 184' },
      { name: 'Hắc Thạch',          hex: '#475569', rgb: '71, 85, 105' },
      { name: 'Huyền Dạ',           hex: '#1e293b', rgb: '30, 41, 59' },

      // 12. Emerald (Ngọc Lục Bảo)
      { name: 'Emerald Green',      hex: '#34d399', rgb: '52, 211, 153' },
      { name: 'Mint Green',         hex: '#6ee7b7', rgb: '110, 231, 183' },
      { name: 'Deep Forest Green',  hex: '#059669', rgb: '5, 150, 105' }
    ];

    // =========================================================================
    // 2. TOÀN BỘ 11 HÀM VẼ DẠNG LÁ CHUẨN GITHUB KÈM CUỐNG LÁ HỮU CƠ
    //    (Đã loại bỏ willow, round, needle theo yêu cầu)
    // =========================================================================
    const deg2rad = d => d * Math.PI / 180;

    // Hàm vẽ cuống lá (Petiole Stem) mềm mại tự nhiên
    function drawPetioleStem(ctx, color, stemLen = 24, curveX = 3, lineWidth = 2.0) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(curveX * 0.4, stemLen);
      ctx.quadraticCurveTo(curveX, stemLen * 0.45, 0, 0);
      ctx.stroke();
      ctx.restore();
    }

    // Helper: drawPointedLobe
    function drawPointedLobeDirect(ctx, w, h) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w * 0.7, -h * 0.3, -w * 0.6, -h * 0.8, 0, -h * 1.1);
      ctx.bezierCurveTo(w * 0.6, -h * 0.8, w * 0.7, -h * 0.3, 0, 0);
      ctx.closePath();
      ctx.fill();
    }

    // Helper: drawRhombusLobe
    function drawRhombusLobeDirect(ctx, w, h) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-w * 0.5, -h * 0.55);
      ctx.lineTo(0, -h * 1.15);
      ctx.lineTo(w * 0.5, -h * 0.55);
      ctx.closePath();
      ctx.fill();
    }

    // 1. Pointed (Lá Cổ Thụ Đỉnh Nhọn / Ngọc Lục Bảo) kèm cuống
    function drawPointed(ctx, color) {
      const w = 32, h = 64;
      ctx.save();
      ctx.translate(0, 24);
      drawPetioleStem(ctx, color, 22, 2.5, 2.0);
      ctx.fillStyle = color;
      drawPointedLobeDirect(ctx, w, h);
      ctx.restore();
    }

    // 2. Maple (Lá Phong 7 Thùy Đỉnh Nhọn) kèm cuống
    function drawMaple(ctx, color) {
      const w = 24 * 1.4;
      const h = 34 * 1.4;
      ctx.save();
      ctx.translate(0, 10);
      drawPetioleStem(ctx, color, 32, 3.5, 2.0);
      ctx.fillStyle = color;

      // Central peak
      drawPointedLobeDirect(ctx, w * 0.75, h * 1.1);

      // Upper shoulders +-40 deg
      ctx.save(); ctx.rotate(deg2rad(-40)); drawPointedLobeDirect(ctx, w * 0.70, h * 1.0); ctx.restore();
      ctx.save(); ctx.rotate(deg2rad(40)); drawPointedLobeDirect(ctx, w * 0.70, h * 1.0); ctx.restore();

      // Side horizontal +-80 deg
      ctx.save(); ctx.rotate(deg2rad(-80)); drawPointedLobeDirect(ctx, w * 0.55, h * 0.80); ctx.restore();
      ctx.save(); ctx.rotate(deg2rad(80)); drawPointedLobeDirect(ctx, w * 0.55, h * 0.80); ctx.restore();

      // Rear lobes +-135 deg
      ctx.save(); ctx.rotate(deg2rad(-135)); drawPointedLobeDirect(ctx, w * 0.40, h * 0.55); ctx.restore();
      ctx.save(); ctx.rotate(deg2rad(135)); drawPointedLobeDirect(ctx, w * 0.40, h * 0.55); ctx.restore();

      ctx.restore();
    }

    // 3. Maple5 (Lá Phong 7 Thùy Hình Thoi) kèm cuống
    function drawMaple5(ctx, color) {
      const w = 24 * 1.4;
      const h = 34 * 1.4;
      ctx.save();
      ctx.translate(0, 10);
      drawPetioleStem(ctx, color, 32, -3.5, 2.0);
      ctx.fillStyle = color;

      // Central top
      drawRhombusLobeDirect(ctx, w * 0.80, h * 1.15);

      // Upper sides +-38 deg
      ctx.save(); ctx.rotate(deg2rad(-38)); drawRhombusLobeDirect(ctx, w * 0.70, h * 0.95); ctx.restore();
      ctx.save(); ctx.rotate(deg2rad(38)); drawRhombusLobeDirect(ctx, w * 0.70, h * 0.95); ctx.restore();

      // Lower sides +-78 deg
      ctx.save(); ctx.rotate(deg2rad(-78)); drawRhombusLobeDirect(ctx, w * 0.44, h * 0.60); ctx.restore();
      ctx.save(); ctx.rotate(deg2rad(78)); drawRhombusLobeDirect(ctx, w * 0.44, h * 0.60); ctx.restore();

      // Rear base +-128 deg
      ctx.save(); ctx.rotate(deg2rad(-128)); drawRhombusLobeDirect(ctx, w * 0.41, h * 0.38); ctx.restore();
      ctx.save(); ctx.rotate(deg2rad(128)); drawRhombusLobeDirect(ctx, w * 0.41, h * 0.38); ctx.restore();

      ctx.restore();
    }

    // 4. Ginkgo Fan (Lá Ngân Hạnh / Bạch Quả) kèm cuống dài
    function drawGinkgoFan(ctx, color) {
      const s = 68;
      ctx.save();
      ctx.translate(0, 22);
      drawPetioleStem(ctx, color, 36, 5, 1.9);
      ctx.fillStyle = color;

      const triangles = [
        { center: -57.5, left: -75.0, right: -40.0 },
        { center: -20.5, left: -38.0, right: -3.0 },
        { center: 20.5,  left: 3.0,   right: 38.0 },
        { center: 57.5,  left: 40.0,  right: 75.0 }
      ];

      for (let k = 0; k < 4; k++) {
        let tInfo = triangles[k];
        let aCenter = deg2rad(tInfo.center);
        let aLeft = deg2rad(tInfo.left);
        let aRight = deg2rad(tInfo.right);

        let envelopeFactor = Math.cos(deg2rad(tInfo.center) * 0.45);
        let triLen = s * (0.78 + 0.22 * envelopeFactor);

        let aSideL = aLeft - deg2rad(2.0);
        let x_sideL = Math.sin(aSideL) * triLen * 0.48;
        let y_sideL = -Math.cos(aSideL) * triLen * 0.48;

        let cp1L_x = Math.sin(aLeft) * triLen * 0.22;
        let cp1L_y = -Math.cos(aLeft) * triLen * 0.22;
        let cp2L_x = Math.sin(aSideL) * triLen * 0.38;
        let cp2L_y = -Math.cos(aSideL) * triLen * 0.38;

        let x_cornerL_c1 = Math.sin(aLeft - deg2rad(6.0)) * triLen * 0.85;
        let y_cornerL_c1 = -Math.cos(aLeft - deg2rad(6.0)) * triLen * 0.85;
        let aBaseL = aLeft + deg2rad(11.5);
        let x_baseL = Math.sin(aBaseL) * triLen * 0.95;
        let y_baseL = -Math.cos(aBaseL) * triLen * 0.95;
        let x_cornerL_c2 = Math.sin(aLeft + deg2rad(3.0)) * triLen * 1.14;
        let y_cornerL_c2 = -Math.cos(aLeft + deg2rad(3.0)) * triLen * 1.14;

        let aSideR = aRight + deg2rad(2.0);
        let x_sideR = Math.sin(aSideR) * triLen * 0.48;
        let y_sideR = -Math.cos(aSideR) * triLen * 0.48;
        let aBaseR = aRight - deg2rad(11.5);
        let x_baseR = Math.sin(aBaseR) * triLen * 0.95;
        let y_baseR = -Math.cos(aBaseR) * triLen * 0.95;
        let x_cornerR_c1 = Math.sin(aRight - deg2rad(3.0)) * triLen * 1.14;
        let y_cornerR_c1 = -Math.cos(aRight - deg2rad(3.0)) * triLen * 1.14;
        let x_cornerR_c2 = Math.sin(aRight + deg2rad(6.0)) * triLen * 0.85;
        let y_cornerR_c2 = -Math.cos(aRight + deg2rad(6.0)) * triLen * 0.85;

        let cp2R_x = Math.sin(aSideR) * triLen * 0.38;
        let cp2R_y = -Math.cos(aSideR) * triLen * 0.38;
        let cp1R_x = Math.sin(aRight) * triLen * 0.22;
        let cp1R_y = -Math.cos(aRight) * triLen * 0.22;

        let cp1Base_x = Math.sin(aCenter - deg2rad(4.0)) * triLen * 0.90;
        let cp1Base_y = -Math.cos(aCenter - deg2rad(4.0)) * triLen * 0.90;
        let cp2Base_x = Math.sin(aCenter + deg2rad(4.0)) * triLen * 1.02;
        let cp2Base_y = -Math.cos(aCenter + deg2rad(4.0)) * triLen * 1.02;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(cp1L_x, cp1L_y, cp2L_x, cp2L_y, x_sideL, y_sideL);
        ctx.bezierCurveTo(x_cornerL_c1, y_cornerL_c1, x_cornerL_c2, y_cornerL_c2, x_baseL, y_baseL);
        ctx.bezierCurveTo(cp1Base_x, cp1Base_y, cp2Base_x, cp2Base_y, x_baseR, y_baseR);
        ctx.bezierCurveTo(x_cornerR_c1, y_cornerR_c1, x_cornerR_c2, y_cornerR_c2, x_sideR, y_sideR);
        ctx.bezierCurveTo(cp2R_x, cp2R_y, cp1R_x, cp1R_y, 0, 0);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // 5. Heart (Lá Hình Trái Tim) kèm cuống
    function drawHeart(ctx, color) {
      const w = 32, h = 56;
      ctx.save();
      ctx.translate(0, 21);
      drawPetioleStem(ctx, color, 24, 3, 2.0);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w * 1.1, -h * 0.35, -w * 1.1, -h * 1.1, -w * 0.5, -h * 1.15);
      ctx.bezierCurveTo(-w * 0.25, -h * 1.18, -w * 0.08, -h * 0.92, 0, -h * 0.82);
      ctx.bezierCurveTo(w * 0.08, -h * 0.92, w * 0.25, -h * 1.18, w * 0.5, -h * 1.15);
      ctx.bezierCurveTo(w * 1.1, -h * 1.1, w * 1.1, -h * 0.35, 0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 6. Single Needle (Lá Me Kép Lông Chim Chẵn 7 Cặp) kèm cuống
    function drawSingleNeedle(ctx, color) {
      const baseH = 48;
      const totalH = baseH * 2.5 * 0.576; // ~69px
      ctx.save();
      ctx.translate(0, 24);

      // Cuống lá me gốc
      drawPetioleStem(ctx, color, 22, 1.5, 2.0);

      // Trục rachis chính
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -totalH * 0.94);
      ctx.stroke();

      const pairs = [
        { yRatio: 0.12, scale: 0.62, angleDeg: 82 },
        { yRatio: 0.25, scale: 0.84, angleDeg: 80 },
        { yRatio: 0.38, scale: 0.98, angleDeg: 76 },
        { yRatio: 0.51, scale: 1.05, angleDeg: 72 },
        { yRatio: 0.64, scale: 0.98, angleDeg: 66 },
        { yRatio: 0.77, scale: 0.84, angleDeg: 58 },
        { yRatio: 0.89, scale: 0.60, angleDeg: 48 }
      ];

      let baseLeafH = (baseH * 1.15 * 0.80) * 0.576;
      let baseLeafW = baseLeafH * 0.32;

      ctx.fillStyle = color;
      for (let i = 0; i < pairs.length; i++) {
        let p = pairs[i];
        let y = -totalH * p.yRatio;
        let hL = baseLeafH * p.scale;
        let wL = baseLeafW * p.scale;
        let rad = deg2rad(p.angleDeg);

        // Left leaflet
        ctx.save();
        ctx.translate(0, y);
        ctx.rotate(-rad);
        ctx.beginPath();
        ctx.ellipse(0, -hL * 0.5, wL, hL * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Right leaflet
        ctx.save();
        ctx.translate(0, y);
        ctx.rotate(rad);
        ctx.beginPath();
        ctx.ellipse(0, -hL * 0.5, wL, hL * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    // 7. Tung La Han (Lá Tùng La Hán 9 Cánh Kim) kèm cuống
    function drawTungLaHan(ctx, color) {
      const baseW = 30;
      const baseH = 40;
      const maxLen = baseH * 1.8; // 72px
      const fanSpread = deg2rad(136);
      const totalNeedles = 9;

      ctx.save();
      ctx.translate(0, 24);

      // Cuống cụm lá kim
      drawPetioleStem(ctx, color, 22, 2.0, 2.2);

      ctx.strokeStyle = color;
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';

      for (let i = 0; i < totalNeedles; i++) {
        let t = (i - 4) / 4;
        let angle = t * (fanSpread / 2);
        let shellEnvelope = Math.cos(t * Math.PI * 0.38);
        let bladeLen = maxLen * (0.55 + 0.45 * shellEnvelope);

        let tipX = Math.sin(angle) * bladeLen;
        let tipY = -Math.cos(angle) * bladeLen;

        let bowUp = (1 - Math.abs(t)) * baseW * 0.45 + bladeLen * 0.08;
        let ctrlX = Math.sin(angle * 0.65) * bladeLen * 0.5;
        let ctrlY = -Math.cos(angle * 0.65) * bladeLen * 0.5 - bowUp;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(ctrlX, ctrlY, tipX, tipY);
        ctx.stroke();
      }

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 8. Sakura Leaf (Lá / Cánh Hoa Anh Đào Khía Chữ V Đỉnh) kèm cuống
    function drawSakuraLeaf(ctx, color) {
      const w = 32 * 1.15;
      const h = 54 * 1.25;
      ctx.save();
      ctx.translate(0, 24);
      drawPetioleStem(ctx, color, 22, 3, 1.9);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-w * 0.95, -h * 0.35, -w * 0.85, -h * 0.85, -w * 0.42, -h * 1.15);
      ctx.lineTo(0, -h * 0.82);
      ctx.lineTo(w * 0.42, -h * 1.15);
      ctx.bezierCurveTo(w * 0.85, -h * 0.85, w * 0.95, -h * 0.35, 0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 9. Eucalyptus Long (Lá Bạch Đàn Dài - Lưỡi Liềm Falcate) kèm cuống
    function drawEucalyptusLong(ctx, color) {
      const leafLen = 76;
      const theta = deg2rad(105);
      const Wmax = 0.085;
      const NUM_POINTS = 24;

      ctx.save();
      ctx.translate(0, 24);

      // Cuống lá bạch đàn nối tiếp mượt mà vào sống lá
      drawPetioleStem(ctx, color, 22, -3.5, 2.0);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 0);

      const leftPts = [];
      const rightPts = [];

      for (let j = 0; j <= NUM_POINTS; j++) {
        const s = j / NUM_POINTS;
        const angle = theta * s;
        const xSpine = (1 - Math.cos(theta * s)) / theta * leafLen;
        const ySpine = -Math.sin(theta * s) / theta * leafLen;

        const w = Wmax * Math.sin(Math.PI * Math.pow(s, 0.72)) * (1.0 - 0.22 * s) * leafLen;
        const nx = Math.cos(angle);
        const ny = Math.sin(angle);

        const lx = xSpine - w * nx;
        const ly = ySpine - w * ny;
        const rx = xSpine + w * nx;
        const ry = ySpine + w * ny;

        leftPts.push({ x: lx, y: ly });
        rightPts.push({ x: rx, y: ry });
        ctx.lineTo(lx, ly);
      }

      for (let j = NUM_POINTS; j >= 0; j--) {
        ctx.lineTo(rightPts[j].x, rightPts[j].y);
      }

      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 10. Oval (Lá Bầu Dục / Oval Chuẩn) kèm cuống
    function drawOval(ctx, color) {
      const w = 40;
      const h = 66;
      ctx.save();
      ctx.translate(0, 21);
      drawPetioleStem(ctx, color, 22, 2.5, 2.0);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(0, -h * 0.5, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 11. Bodhi (Lá Bồ Đề Linh Thiêng Đỉnh Nhỏ Giọt Drip Tip) kèm cuống dài
    function drawBodhi(ctx, color) {
      const w = 34;
      const h = 60;
      ctx.save();
      ctx.translate(0, 20);

      // Cuống lá bồ đề dài mảnh mai đặc trưng
      drawPetioleStem(ctx, color, 28, 4, 1.9);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 0); // Điểm nối cuống ở gốc
      // Bờ vai tim bên trái
      ctx.bezierCurveTo(-w * 0.6, -h * 0.05, -w * 1.15, -h * 0.35, -w * 0.95, -h * 0.65);
      // Vuốt nhọn thon nhỏ về đỉnh nhỏ giọt bên trái
      ctx.bezierCurveTo(-w * 0.75, -h * 0.85, -w * 0.22, -h * 0.95, 0, -h * 1.18);
      // Vuốt nhọn thon nhỏ từ đỉnh nhỏ giọt sang phải
      ctx.bezierCurveTo(w * 0.22, -h * 1.18, w * 0.75, -h * 0.85, w * 0.95, -h * 0.65);
      // Bờ vai tim bên phải quay về gốc cuống
      ctx.bezierCurveTo(w * 1.15, -h * 0.35, w * 0.6, -h * 0.05, 0, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // =========================================================================
    // DANH MỤC 11 DẠNG LÁ HỆ THỐNG (ĐÃ BỎ willow, round, needle)
    // =========================================================================
    const LEAF_CATALOG = [
      { id: 'pointed',          name: 'Lá Đỉnh Nhọn',      draw: drawPointed },
      { id: 'maple',            name: 'Lá Phong 7 Thùy',   draw: drawMaple },
      { id: 'maple5',           name: 'Lá Phong Thoi',     draw: drawMaple5 },
      { id: 'ginkgo_fan',       name: 'Lá Ngân Hạnh',      draw: drawGinkgoFan },
      { id: 'heart',            name: 'Lá Trái Tim',       draw: drawHeart },
      { id: 'single_needle',    name: 'Lá Me Kép',         draw: drawSingleNeedle },
      { id: 'tung_lahan',       name: 'Lá Tùng La Hán',    draw: drawTungLaHan },
      { id: 'sakura_leaf',      name: 'Lá Hoa Anh Đào',    draw: drawSakuraLeaf },
      { id: 'eucalyptus_long',  name: 'Lá Bạch Đàn Dài',   draw: drawEucalyptusLong },
      { id: 'oval',             name: 'Lá Oval Bầu Dục',   draw: drawOval },
      { id: 'bodhi',            name: 'Lá Bồ Đề',          draw: drawBodhi }
    ];

    let currentLeafIdx = 0;
    let currentColorIdx = 0;
    let currentAngle = 0;

    const canvas = document.getElementById('heroLeafCanvas');
    const ctx = canvas.getContext('2d');
    const subtitleEl = document.getElementById('appSubtitle');

    function renderLeaf(leafIdx, colorIdx, angle) {
      const leaf = LEAF_CATALOG[leafIdx];
      const colorItem = GITHUB_LEAF_PALETTES[colorIdx];

      ctx.clearRect(0, 0, 240, 240);

      // Xoay 360 độ ngẫu nhiên quanh tâm canvas (120, 120)
      ctx.save();
      ctx.translate(120, 120);
      ctx.rotate(angle);
      leaf.draw(ctx, colorItem.hex);
      ctx.restore();

      // Hiệu ứng ánh hào quang tương ứng với mã màu lá
      canvas.style.filter = `drop-shadow(0 0 25px ${colorItem.hex}) drop-shadow(0 0 45px rgba(${colorItem.rgb}, 0.55))`;
      if (subtitleEl) {
        subtitleEl.style.color = colorItem.hex;
      }
    }

    function changeRandomLeaf() {
      // Chọn ngẫu nhiên 1 dạng lá khác dạng hiện tại trong 11 dạng lá
      let nextLeafIdx;
      do {
        nextLeafIdx = Math.floor(Math.random() * LEAF_CATALOG.length);
      } while (nextLeafIdx === currentLeafIdx && LEAF_CATALOG.length > 1);
      currentLeafIdx = nextLeafIdx;

      // Chọn ngẫu nhiên 1 màu sắc khác màu hiện tại
      let nextColorIdx;
      do {
        nextColorIdx = Math.floor(Math.random() * GITHUB_LEAF_PALETTES.length);
      } while (nextColorIdx === currentColorIdx && GITHUB_LEAF_PALETTES.length > 1);
      currentColorIdx = nextColorIdx;

      // Góc xoay 360 độ ngẫu nhiên bất kỳ (từ 0 đến 2 * PI radian)
      const nextAngle = Math.random() * Math.PI * 2;
      currentAngle = nextAngle;

      // Hiệu ứng co giãn và chuyển đổi mượt mà
      canvas.style.transform = 'scale(0.85)';
      canvas.style.opacity = '0.4';

      setTimeout(() => {
        renderLeaf(currentLeafIdx, currentColorIdx, currentAngle);
        canvas.style.transform = 'scale(1)';
        canvas.style.opacity = '1';
      }, 90);
    }

    // Vẽ ngay chiếc lá ban đầu (Pointed - Emerald) với góc xoay ngẫu nhiên
    renderLeaf(0, 34, Math.random() * Math.PI * 2);

    // Đổi dáng lá, cuống lá, màu sắc và góc xoay 360 độ ngẫu nhiên cứ NỬA GIÂY (500ms) MỘT LẦN
    setInterval(changeRandomLeaf, 500);

    // Chuyển trang tự động sau khi vạch loading hoàn tất (2.6 giây)
    let isRedirecting = false;
    function enterGarden() {
      if (isRedirecting) return;
      isRedirecting = true;
      window.location.href = '01-garden-dashboard.html';
    }

    setTimeout(enterGarden, 2600);
  </script>
